<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HandMirror</title>
    <meta name="description" content="HandMirror — a searchable Auslan sign-language reference, indexed like a specimen catalogue." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- A render-blocking <link>, not a JS import in main.tsx -- in Vite's
         dev server a CSS import injects a <style> tag only once that JS
         module has loaded, so the grid layout visibly snaps in after an
         unstyled first paint. A <link> is fetched and applied before the
         page paints at all, in both dev and the production build. -->
    <link rel="stylesheet" href="/src/styles/theme.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
